name: Dog Gram IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        type: choice
        default: debug_arm64
        options:
          - debug_arm64
          - release_arm64

permissions:
  contents: read

jobs:
  build:
    # Use the standard Xcode 27 runner so the build can run without a larger-runner billing setup.
    # The first Bazel build may exceed this runner's 7 GB RAM; use xcode-27-xlarge if that happens.
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Check out Dog Gram and all source submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Xcode version
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          test -d "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          XCODEBUILD_VERSION_OUTPUT="$(xcodebuild -version)"
          ACTUAL_VERSION="$(echo "$XCODEBUILD_VERSION_OUTPUT" | awk '/^Xcode / { print $2 }')"
          echo "Using Xcode $ACTUAL_VERSION"
          test "$ACTUAL_VERSION" = "$XCODE_VERSION"

      - name: Prepare canonical source directory
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="/Users/Shared/doggram-ios-${GITHUB_RUN_ID}"
          mkdir -p /Users/Shared
          ditto "$GITHUB_WORKSPACE" "$SOURCE_DIR"
          echo "DOGGRAM_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Prepare private build configuration
        shell: bash
        env:
          DOGGRAM_API_ID: ${{ secrets.DOGGRAM_API_ID }}
          DOGGRAM_API_HASH: ${{ secrets.DOGGRAM_API_HASH }}
        run: |
          set -euo pipefail
          for name in DOGGRAM_API_ID DOGGRAM_API_HASH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          cd "$DOGGRAM_SOURCE_DIR"
          export DOGGRAM_API_ID DOGGRAM_API_HASH
          python3 - <<'PY'
          import json
          import os

          source = "build-system/doggram-development-configuration.example.json"
          destination = "build-system/doggram-local-configuration.json"
          with open(source, encoding="utf-8") as file:
              configuration = json.load(file)
          configuration["api_id"] = os.environ["DOGGRAM_API_ID"]
          configuration["api_hash"] = os.environ["DOGGRAM_API_HASH"]
          # Only used by the locally generated test profiles signed with Telegram's public
          # fake certificate. This is not the user's Apple Team ID.
          configuration["team_id"] = "C67CF9S4VU"
          with open(destination, "w", encoding="utf-8") as file:
              json.dump(configuration, file, indent=2)
          PY

      - name: Prepare fake signing for Sideloadly re-signing
        shell: bash
        run: |
          set -euo pipefail
          cd "$DOGGRAM_SOURCE_DIR"
          mkdir -p build-system/doggram-verification-signing/certs
          cp build-system/fake-codesigning/certs/* \
            build-system/doggram-verification-signing/certs/
          # Generate profiles first: the generator rewrites the keychain search list, which
          # would drop a keychain imported before it.
          python3 build-system/Make/PrepareDogGramVerificationProfiles.py
          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          # Fail fast (before a ~50 minute compile) if codesign cannot see the identity
          # whose certificate the generated profiles reference.
          security list-keychains -d user
          IDENTITIES="$(security find-identity -p codesigning)"
          echo "$IDENTITIES"
          for profile in build-system/doggram-verification-signing/profiles/*.mobileprovision; do
            security cms -D -i "$profile" > profile.plist
            python3 -c 'import plistlib,sys; sys.stdout.buffer.write(plistlib.load(open("profile.plist","rb"))["DeveloperCertificates"][0])' > profile-cert.der
            SHA1="$(openssl x509 -inform DER -in profile-cert.der -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')"
            if ! echo "$IDENTITIES" | grep -qi "$SHA1"; then
              echo "::error::No signing identity $SHA1 for $profile"
              exit 1
            fi
          done
          rm -f profile.plist profile-cert.der
          echo "All profiles have a matching signing identity"

      - name: Build Dog Gram IPA
        shell: bash
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -euo pipefail
          cd "$DOGGRAM_SOURCE_DIR"

          export APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export COMMIT_COUNT=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))
          export BUILD_NUMBER=$((COMMIT_COUNT + GITHUB_RUN_NUMBER))

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="/private/var/tmp/_bazel_doggram" \
            build \
            --configurationPath=build-system/doggram-local-configuration.json \
            --codesigningInformationPath=build-system/doggram-verification-signing \
            --configuration="$BUILD_CONFIGURATION" \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp build/artifacts/Telegram.ipa \
            "$GITHUB_WORKSPACE/artifacts/DogGram-${BUILD_CONFIGURATION}-resign-required-${BUILD_NUMBER}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: DogGram-${{ inputs.configuration }}-resign-required-${{ github.run_number }}
          path: artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14
